# Bedrock trading-bot config
#
# Splittet i to seksjoner (Fase 8, session 39-40):
#
# - startup_only: krever bot-restart for endring. SIGHUP logger
#   advarsel, men holder gamle verdier aktive.
# - reloadable:   SIGHUP plukker opp endringer umiddelbart.
#
# Alle tall er defaults portert 1:1 fra ~/scalp_edge/trading_bot.py
# ved Fase 8-oppstart. Se docs/migration/bot_refactor.md § 5 for kilde-
# linjenumre og forklaring per felt.
#
# Schema valideres av bedrock.bot.config.BotConfig (extra="forbid").

startup_only:
  # Signal-server URL. Bedrock-server eksponerer bot-tilpasset signal-
  # endpoint på `/bot/signals` (blueprint url_prefix=`/bot`, sub-fase
  # 12.9 D1, commit 649f429). SignalComms gjør GET `<signal_url>/signals`
  # → derfor må base-URL inkludere `/bot`-prefix for å lande på den
  # nye endpointen. Bedrock-server lytter på 127.0.0.1:5100; gammel
  # scalp_edge signal_server (port 5000) retires i D6.
  signal_url: "http://127.0.0.1:5100/bot"

  # Navn på env-var som holder API-nøkkelen (ikke selve nøkkelen).
  # `null` = ingen API-key sendes. Bedrock-server kjører lokalt på
  # samme host; trafikken er loopback-isolert og trenger ingen auth.
  # Settes til en env-var-streng (f.eks. "SCALP_API_KEY") hvis bot
  # skal snakke med en remote signal-server.
  signal_api_key_env: null

  # cTrader reconnect-budsjett. >= max_in_window reconnects innen
  # window_sec sekunder = FATAL exit (kode 79).
  reconnect:
    window_sec: 600
    max_in_window: 5

reloadable:
  # 3-punkt confirmation (body, wick-rejection, EMA-gradient)
  # Scoring-modell — krev minst min_score av 3 poeng.
  confirmation:
    min_score_default: 2
    max_candles_default: 6
    body_threshold_atr_pct: 0.30   # body ≥ 0.30 × ATR for 1 poeng
    ema_gradient_buy_min: -0.05
    ema_gradient_sell_max: 0.05

  # Risk-% per tier. Velges av bot basert på geo/VIX/character.
  risk_pct:
    full: 1.0
    half: 0.5
    quarter: 0.25

  # Risikobasert sizing (2026-09-04, erstatter faste lot-tiers):
  #   lots = balanse × risk_pct / (SL-avstand × enheter/lot × quote→konto-kurs)
  # Kontoen er i NOK — ekte PnL fra cTrader er NOK (empirisk verifisert:
  # real/est-ratio ≈ USDNOK på tvers av 12 instrumenter).
  sizing:
    account_currency: NOK
    min_lot_max_overshoot: 1.5   # min-lot OK hvis SL-risiko ≤ 1.5× planlagt
    agri_risk_factor: 0.5        # agri: halv risk (som før via lot-halvering)

  # Daily-loss-gate. Bot låser entries når daily_loss ≥ limit.
  # limit = max(pct_of_balance × balance, minimum_nok) — minimum
  # gjelder for små kontoer.
  daily_loss:
    pct_of_balance: 2.0
    minimum_nok: 500

  # Spread-filter (entry-gate)
  spread:
    min_samples: 10                    # cold-start-vern
    agri_multiplier: 2.5               # agri: 2.5 × snitt-spread
    non_agri_multiplier_of_stop: 2.0   # non-agri: stop_multiplier × 2
    # SL-vs-spread guard: blokker trade hvis risk_per_unit < N × current_spread.
    # Forhindrer at SL ligger så tett på entry at normal bid-ask alene
    # utløser stop (NATGAS-bug 2026-05-14). SCALP får lavere terskel
    # fordi SCALP-SL er naturlig tettere (~1×ATR(M5)).
    sl_min_spread_mult_scalp: 1.5
    sl_min_spread_mult_swing: 2.0
    sl_min_spread_mult_makro: 2.0

  # Loss-cooldown per signal_id. permanent_after_loss (2026-09-04): re-entry
  # etter tap på samme id var -0.56R snitt uansett gap (n=75, -42R av -73R);
  # nivået må re-genereres som ny setup før det handles igjen.
  # 2026-09-05: signal_id er slot-hash (instrument, retning, horisont) og
  # endres aldri når nivået flytter seg — id-basert permanent blokk låste
  # 45 av 57 slotter. Blokken er nå nøklet på NIVÅ: re-entry blokkeres
  # bare når signalets entry ligger innenfor level_atr_mult × ATR(D1) av
  # entry-prisen der tapet skjedde. Tap eldre enn loss_level_max_age_days
  # lastes ikke ved oppstart (0 = ingen grense).
  cooldown:
    loss_ttl_hours: 72
    permanent_after_loss: true
    level_atr_mult: 1.0
    loss_level_max_age_days: 90

  # Per-horisont TTL i sekunder — måles mot batchens signals_generated_at
  # (siste vellykkede signals-all-kjøring), IKKE per-signal created_at.
  # Regen er event-drevet etter hver fetch (prices hver time), så SCALP-
  # TTL må dekke én pris-syklus + margin.
  horizon_ttl:
    scalp:  4500      # 75 min
    swing:  14400     # 4 t
    makro:  86400     # 24 t

  # Fill-tids-vakter (2026-09-05). Generator-geometri er relativ til
  # alert_level; fill skjer i sonen ± confirmation-drift. SCALP ble fylt
  # 0.01–0.15 ATR fra SL (6 trades, alle tap), SWING med R:R 0.9 ved fill.
  #   min/max_sl_distance_frac: faktisk SL-avstand vs planlagt |alert−stop|
  #   check_rr_at_fill:         R:R fra fill-pris må nå horizon_min_rr
  #   max_same_direction_per_instrument: åpne posisjoner samme retning,
  #     alle horisonter (SILVER SWING+MAKRO 4. sep = dobbel risiko, samme tese)
  entry_guard:
    min_sl_distance_frac: 0.6
    max_sl_distance_frac: 1.5
    check_rr_at_fill: true
    max_same_direction_per_instrument: 1

  # Per-horisont minimum R:R-gate. Synkronisert med generator-floors
  # (SetupConfig.min_rr_scalp=1.5, min_rr_swing=2.5) så bot ikke slipper
  # gjennom setups med svakere R:R enn det generator allerede filtrerte
  # på. MAKRO bruker trailing (rr=None fra generator); 2.0-floor brukes
  # kun hvis tp er satt eksplisitt.
  horizon_min_rr:
    scalp: 1.5
    swing: 2.5
    makro: 2.0

  # Signal-server-polling. Bot adapter intervall når SCALP-signaler er
  # aktive (kortere horisont = raskere poll).
  polling:
    default_seconds: 60
    scalp_active_seconds: 20

  # Fredag 20:00 CET: lukk SCALP + stram SL. 19:00-20:00: kun stram SL.
  weekend:
    sl_atr_mult: 1.5

  # Mandag første time: blokker entry hvis gap > 2×ATR fra fredag close
  monday_gap:
    atr_multiplier: 2.0

  # Trailing-stop fallback (brukes hvis group_params mangler verdi)
  trail:
    default_atr_mult: 1.5

  # Agri-spesifikke begrensninger
  agri:
    max_concurrent: 2
    max_per_subgroup: 1
    max_spread_atr_ratio: 0.40
    # Åpningstider i CET (Europe/Oslo) — DST-korrekt via ZoneInfo
    session_times_cet:
      corn:    { start: "09:00", end: "21:00" }
      wheat:   { start: "09:00", end: "21:00" }
      soybean: { start: "09:00", end: "21:00" }
      coffee:  { start: "09:00", end: "19:30" }
      cotton:  { start: "09:00", end: "20:00" }
      sugar:   { start: "09:00", end: "19:30" }
      cocoa:   { start: "09:00", end: "19:30" }

  # Oil-spesifikke gate-verdier
  oil:
    min_sl_pips: 25
    max_spread_mult: 3.0

  # Per-gruppe exit/management. Oppslag via
  # bedrock.bot.instruments.get_group_name(instrument).
  #
  # trail_atr:  multiplikator for trailing stop-distanse
  # gb_peak:    peak-progress som aktiverer giveback-logikk (0-1)
  # gb_exit:    exit hvis drawdown fra peak > gb_exit (0-1)
  # be_atr:     break-even-aktivering (atr-ratio av fremgang mot T1)
  # expiry:     timeout-candles (15m-enheter)
  # ema9_exit:  true = P4 EMA9-exit aktiv (scalp-style)
  group_params:
    fx:
      trail_atr: 2.5
      gb_peak: 0.85
      gb_exit: 0.30
      be_atr: 0.10
      expiry: 32
      ema9_exit: true
