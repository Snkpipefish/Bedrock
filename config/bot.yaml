      gb_peak: 0.88
      gb_exit: 0.42
      be_atr: 0.25
      expiry: 48
      ema9_exit: false
    oil:
      trail_atr: 3.0
      gb_peak: 0.90
      gb_exit: 0.45
      be_atr: 0.20
      expiry: 48
      ema9_exit: false
    indices:
      trail_atr: 2.8
      gb_peak: 0.85
      gb_exit: 0.35
      be_atr: 0.15
      expiry: 40
      ema9_exit: true
